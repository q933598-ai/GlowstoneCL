[package]
name = "glowstonecl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["linux-wayland", "linux-x11"]
linux-wayland = ["iced/wayland"]
linux-x11 = ["iced/x11"]

[dependencies]
glowstone-core = { path = "../glowstone-core" }
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "tokio",
    "canvas",
    "image",
    "svg",
    "advanced",
] }
crust_core = "1.0.3"
directories = "6.0"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "windows-native", "crypto-rust"] }
md5 = "0.7"
png = "0.17"
rfd = "0.15.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { workspace = true }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
webbrowser = "1.0"
base64 = "0.22"
flate2 = "1.1"
ring = "0.17"
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
tokio = { version = "1.0", features = ["time", "process", "fs", "io-util", "rt", "macros"] }
